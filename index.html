<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sistem Informasi Manajemen Usaha</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Logo -->
            <div class="logo">
                <i class="fa-solid fa-chart-simple"></i>
                <div>
                    <h2>SIMP</h2>
                    <p>Perhitungan HPP</p>
                </div>
            </div>

            <!-- Menu -->
            <div class="menu">
                <a class="active">
                    <i class="fa-solid fa-box"></i>
                    <span>Data Bahan</span>
                </a>
                <a>
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Data Produk</span>
                </a>
                <a>
                    <i class="fa-solid fa-file-signature"></i>
                    <span>Pesanan PO</span>
                </a>
                <a>
                    <i class="fa-solid fa-money-bill-trend-up"></i>
                    <span>Keuangan</span>
                </a>
                <a>
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Laporan</span>
                </a>
                <a>
                    <i class="fa-solid fa-gear"></i>
                    <span>Pengaturan</span>
                </a>
            </div>
        </div>

        <div class="main">
            <!-- Navbar -->
            <div class="navbar">
                <div>
                    <h1>Data Bahan</h1>
                    <p>Kelola seluruh bahan baku untuk produk.</p>
                </div>
                <button id="btnTambah">
                    <i class="fa-solid fa-plus"></i> Tambah Bahan
                </button>
            </div>

            <!-- Tabel -->
           <div class="table-box">
                <div class="table-header">
                    <input type="text" placeholder="🔍 Cari bahan...">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Bahan</th>
                            <th>Harga Beli</th>
                            <th>Jumlah</th>
                            <th>Harga/Pcs</th>
                            <th>Stok</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <h2>Tambah Bahan</h2>
                <form id="formBarang">
                    <input id="nama_barang" placeholder="Nama Bahan" required>
                    <input id="harga_beli" type="number" placeholder="Harga Beli" required>
                    <input id="jumlah" type="number" placeholder="Jumlah" required>
                    <input id="harga_per_pcs" readonly placeholder="Harga / pcs" required>
                    <input id="stok" type="number" placeholder="stok" required>

                    <div class="button-group">
                        <button type="button" class="batal">Batal</button>
                        <button>Simpan</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="script.js"></script>

    </body>

</html>
