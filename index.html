<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sistem Informasi Manajemen Penjualan</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Sidebar -->
        <div class="sidebar">

            <!-- Logo -->
            <div class="logo">
                <i class="fa-solid fa-chart-simple"></i>
                <div>
                    <h2>SIMP</h2>
                    <p>Perhitungan HPP</p>
                </div>
            </div>

            <!-- Menu -->
            <div class="menu">
                <a href="index.html" class="active">
                    <i class="fa-solid fa-box"></i>
                    <span>Data Bahan</span>
                </a>

                <a href="produk.html">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Data Produk</span>
                </a>

                <a>
                    <i class="fa-solid fa-file-signature"></i>
                    <span>Pesanan PO</span>
                </a>

                <a>
                    <i class="fa-solid fa-money-bill-trend-up"></i>
                    <span>Keuangan</span>
                </a>

                <a>
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Laporan</span>
                </a>

                <a>
                    <i class="fa-solid fa-gear"></i>
                    <span>Pengaturan</span>
                </a>

            </div>
        </div>

        <div class="main">
            
            <!-- Navbar -->
            <div class="navbar">
                <div>
                    <h1>Data Bahan</h1>
                    <p>Kelola seluruh bahan baku untuk produk.</p>
                </div>
                <button id="btnTambah">
                    <i class="fa-solid fa-plus"></i> Tambah Bahan
                </button>
            </div>

            <!-- Tabel -->
           <div class="table-box">
                <div class="table-header">
                    <input type="text" placeholder="🔍 Cari bahan...">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Bahan</th>
                            <th>Harga Beli</th>
                            <th>Jumlah</th>
                            <th>Harga/Pcs</th>
                            <th>Stok</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <h2>Tambah Bahan</h2>
                <form id="formBarang">
                    <label for="nama_barang">Nama Bahan</label>
                    <input id="nama_barang" placeholder="Masukkan nama bahan" required>

                    <label for="harga_beli">Harga Beli</label>
                    <input id="harga_beli" type="text" placeholder="Rp0">

                    <label for="jumlah">Jumlah</label>
                    <input id="jumlah" type="number" placeholder="Jumlah isi" required>

                    <label for="harga_per_pcs">Harga / Pcs</label>
                    <input id="harga_per_pcs" type="text" readonly placeholder="Rp0">

                    <label for="stok">Stok</label>
                    <input id="stok" type="number" placeholder="Masukkan stok" required>

                    <div class="button-group">
                        <button type="button" class="batal">Batal</button>
                        <button>Simpan</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal Tambah Stok -->
        <div id="modalTambahStok" class="modal">
            <div class="modal-content">

                <h2>Tambah Stok</h2>

                <form id="formTambahStok">

                    <label>Nama Bahan</label>
                    <input id="namaStok" type="text" readonly>

                    <label>Stok Saat Ini</label>
                    <input id="stokSaatIni" type="number" readonly>

                    <label>Jumlah Dibeli</label>
                    <input id="jumlahBeli" type="number" min="1" placeholder="Masukkan jumlah" required>

                    <label>Harga Pembelian</label>
                    <input id="hargaPembelian" type="text" placeholder="Rp0" required>

                    <div class="button-group">
                        <button type="button" class="batalTambahStok">Batal</button>
                        <button type="submit">Simpan</button>
                    </div>

                </form>

            </div>
        </div>

        <!-- Modal Penyesuaian Stok -->
        <div id="modalPenyesuaian" class="modal">
            <div class="modal-content">

                <h2>Penyesuaian Stok</h2>

                <form id="formPenyesuaian">

                    <label>Nama Bahan</label>
                    <input id="namaPenyesuaian" type="text" readonly>

                    <label>Stok Saat Ini</label>
                    <input id="stokPenyesuaian" type="number" readonly>

                    <label>Alasan</label>
                    <select id="alasanPenyesuaian" required>
                        <option value="">-- Pilih Alasan --</option>
                        <option value="Rusak">🗑️ Rusak</option>
                        <option value="Sampel">🧪 Sampel</option>
                        <option value="Pemakaian Pribadi">🏠 Pemakaian Pribadi</option>
                        <option value="Lainnya">📝 Lainnya</option>
                    </select>

                    <div id="keteranganBox" style="display: none;">
                        <label>Keterangan</label>
                        <input
                            id="keteranganPenyesuaian"
                            type="text"
                            placeholder="Masukkan keterangan">
                    </div>

                    <label>Jumlah yang Dikurangi</label>
                    <input id="jumlahPenyesuaian" type="number" min="1" placeholder="Masukkan jumlah" required>

                    <div class="button-group">
                        <button type="button" class="batalPenyesuaian">Batal</button>
                        <button type="submit">Simpan</button>
                    </div>

                </form>

            </div>
        </div>

        <script src="script.js"></script>

    </body>

</html>
